# This workflow is managed by gh actions-lock.
# lean.yml — build the Lean 4 tropical proofs and audit their axioms.
#
# Load-bearing build workflow (kept standalone in-repo, not in the shared
# governance bundle): `lake build` over both order-reversing twins, then a
# `#print axioms` audit asserting no `sorry`/`Classical.choice` crept in.
# Toolchain is pinned by ./lean-toolchain (leanprover/lean4:v4.35.0); no Mathlib.

name: Lean

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lake-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0

      - name: Install elan (Lean toolchain manager)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Show toolchain (pinned via lean-toolchain)
        run: lean --version

      - name: lake build
        run: lake build

      - name: Axiom audit — no sorry; propext/Quot.sound only
        run: |
          cat > /tmp/axcheck.lean <<'EOF'
          import TropicalSessionTypes
          import TropicalAdapterPath
          import Resource
          #print axioms Hyperpolymath.Tropical.soundness
          #print axioms Hyperpolymath.Tropical.tropical_grade_le_sequentialTotal
          #print axioms Hyperpolymath.ProtocolSquisher.Tropical.pathCost_mono
          #print axioms Hyperpolymath.ProtocolSquisher.Tropical.hub_ceiling
          #print axioms Hyperpolymath.ProtocolSquisher.Tropical.dualGrade_invol
          #print axioms Hyperpolymath.ProtocolSquisher.Tropical.dual_tcAdd_is_max
          #print axioms Hyperpolymath.ProtocolSquisher.Tropical.dual_tcMul_is_min
          -- Resource-grade axis: interface, transport theorem, instances, stress test
          #print axioms Resource.parametric_resource_transport
          #print axioms Resource.resource_laws_sufficient_for_consumers
          #print axioms Resource.ResourceAlgebra.ofIdempotentAdd
          #print axioms Resource.Instances.Linear.instResourceAlgebra
          #print axioms Resource.Instances.Affine.instResourceAlgebra
          #print axioms Resource.Instances.MaxPlus.instResourceAlgebra
          #print axioms Resource.Instances.MinPlus.MinPlus.instResourceAlgebra
          #print axioms Resource.Instances.MinMax.MinMax.instResourceAlgebra
          #print axioms Resource.Instances.infinite_maxPlus
          #print axioms Resource.Instances.infinite_minPlus
          #print axioms Resource.Instances.infinite_minMax
          #print axioms Resource.echoResidueAsMaxPlusCost
          -- Bridges: the two original twins as instances of the axis
          #print axioms Resource.Bridge.grade_le_sequential
          #print axioms Resource.Bridge.hub_ceiling_le
          #print axioms Resource.Bridge.embed_tcZero_ne_zero
          -- HubCeiling: squeakwell R5–R7 (hub ceiling, reach grade, weighted residue measure)
          #print axioms Resource.HubCeiling.factor_le
          #print axioms Resource.HubCeiling.single_hub_ceiling
          #print axioms Resource.HubCeiling.single_hub_star_ceiling
          #print axioms Resource.HubCeiling.lsum_filter_mono
          #print axioms Resource.HubCeiling.reachGrade_mono_mat
          #print axioms Resource.HubCeiling.reachGrade_mono_set
          #print axioms Resource.HubCeiling.one_le_reachGrade
          #print axioms Resource.HubCeiling.weightedResidueMeasure
          #print axioms Resource.HubCeiling.Witness.maxplus_not_one_top
          EOF
          out="$(lake env lean /tmp/axcheck.lean 2>&1)"
          echo "$out"
          if echo "$out" | grep -qiE 'sorry|Classical\.choice|error'; then
            echo "::error::axiom audit failed — sorry, Classical.choice or an elaboration error present"
            exit 1
          fi
          # Allowlist: every printed dependency must be propext or Quot.sound.
          # Any other axiom (a project `axiom`, funext, Classical.*) fails the audit.
          extra="$(echo "$out" | grep -o 'depends on axioms: \[[^]]*\]' \
            | sed -E 's/.*\[(.*)\]/\1/; s/,/ /g' | tr ' ' '\n' \
            | grep -v '^$' | grep -vxE 'propext|Quot\.sound' || true)"
          if [ -n "$extra" ]; then
            echo "::error::axiom audit failed — axioms outside the allowlist: $extra"
            exit 1
          fi
